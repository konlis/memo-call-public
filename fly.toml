# fly.toml app configuration file for memo-call
# Generated by `fly launch` 2026-05-27, then customized per
# context/foundation/infrastructure.md v2 spec.
#
# Deviations from infrastructure.md v2 (documented for audit trail):
#   - primary_region = 'fra' instead of 'waw' — Warsaw not available for this
#     account (verified via `fly platform regions`); 'fra' is the documented
#     fallback per infrastructure.md risk register #2.
#
# See https://fly.io/docs/reference/configuration/ for field semantics.

app = 'CHANGE-ME-memo-call'
primary_region = 'fra'

[build]

[env]
  # Cap V8's old-space heap below the 512MB VM so the Node process GCs defensively
  # instead of growing RSS toward a cgroup OOM-kill — and, just as important, so
  # guaranteed page-cache headroom stays free for SQLite (the OS page cache is what
  # made the panel-list-latency fix work; see the [[vm]] note). 256MB is generous vs
  # the ~100MB steady-state JS heap yet leaves ~150-200MB for page cache + kernel.
  # Heap does NOT scale with conversation count — conversations.list is keyset-
  # paginated (20 rows/page) and getById loads one row — so this is a safety ceiling,
  # not a per-row cost. Applies on next `fly deploy`. See context/changes/panel-list-latency.
  NODE_OPTIONS = '--max-old-space-size=256'

[http_service]
  internal_port = 3000
  force_https = true
  # auto_stop_machines = 'off': predictable cost + no cold-start for first call
  # of the day; matches infrastructure.md operational story.
  auto_stop_machines = 'off'
  auto_start_machines = true
  # min_machines_running = 1: always-on Machine enables in-process retry queue
  # for FR-006 (sub-second retry) and eliminates FR-002 race condition.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  # Bumped 256MB -> 512MB on 2026-06-18 (change: panel-list-latency). At 256MB the
  # always-on Node process held ~166MB RSS, leaving ~7MB MemAvailable and crushing
  # the OS page cache to ~14MB — SQLite then re-read DB pages from the /data volume
  # on every query, so trivial <50-row reads took 1.3-4.1s server-side (thrash-
  # without-OOM-kill; loadavg >1 on the 1 vCPU was a consequence, not the cause).
  # 512MB restores page-cache headroom. See context/changes/panel-list-latency/frame.md.
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[mounts]
  # SQLite database lives on persistent Volume; survives Machine restarts/upgrades.
  # Volume must be created BEFORE first deploy: `fly volumes create memocall_data --region fra --size 3`
  source = 'memocall_data'
  destination = '/data'

# No [deploy] release_command: Fly's release_command runs in a separate
# ephemeral Machine that cannot attach the same single-Volume that the
# running app Machine holds (SQLITE_CANTOPEN err 14 — verified Phase 3
# deploy attempt 2). Migrations run instead via docker-entrypoint.sh on
# app-Machine boot, with the same fail-fast / rollback semantic. See
# Dockerfile + docker-entrypoint.sh for the wiring.
